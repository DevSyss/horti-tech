<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HortiTech - Cadastro Colaborador</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <!-- ICONS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="/css/cadastro.css">

</head>

<body>

<div class="glass-background"></div>

<main class="main-container animate-pop-in">

    <!-- ESQUERDA -->
    <section class="left-side">

        <div class="content-wrapper">

            <div class="logo-area">

                <i class="fa-solid fa-leaf"></i>

                <span>HortiTech</span>

            </div>

            <h1>

                CADASTRE <br>

                <span class="highlight">
                    COLABORADORES
                </span>

            </h1>

            <p>
                Gerencie sua equipe com tecnologia e segurança.
            </p>

            <a href="login.html">

                <button
                        type="button"
                        class="btn-outline"
                >
                    LOGIN
                </button>

            </a>

        </div>

    </section>

    <!-- DIREITA -->
    <section class="right-side">

        <div class="card-cadastro">

            <div class="avatar-circle">

                <i class="fa-solid fa-circle-user"></i>

            </div>

            <!-- FORM -->
            <form id="cadastroForm">

                <!-- NOME -->
                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input
                            type="text"
                            id="nome"
                            placeholder="NOME COMPLETO"
                            required
                    >

                </div>

                <!-- CPF -->
                <div class="input-group">

                    <i class="fa-solid fa-address-card"></i>

                    <input
                            type="text"
                            id="cpf"
                            placeholder="CPF"
                            maxlength="14"
                            required
                    >

                </div>

                <!-- EMAIL -->
                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                            type="email"
                            id="email"
                            placeholder="E-MAIL"
                            required
                    >

                </div>

                <!-- SENHA -->
                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                            type="password"
                            id="senha"
                            placeholder="SENHA"
                            required
                    >

                </div>

                <!-- BOTÃO -->
                <button
                        type="submit"
                        class="btn-main"
                        id="btnCadastrar"
                >
                    CADASTRAR
                </button>

            </form>

        </div>

    </section>

</main>

<!-- JS -->
<script src="/script/cadastro.js"></script>

</body>
</html>
