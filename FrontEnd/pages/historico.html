<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HortiTech | Histórico</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/historico.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app-wrapper">

  <aside class="side-navigation">
    <div class="nav-brand">
      <div class="logo-circle">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <span>HortiTech</span>
    </div>

    <nav class="nav-menu">
      <a href="#" class="nav-link">
        <i class="fa-solid fa-gauge-high"></i>
        <span>MONITORAMENTO</span>
      </a>
      
      <a href="#" class="nav-link active">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>HISTÓRICO</span>
      </a>
      
      <a href="#" class="nav-link">
        <i class="fa-solid fa-bell"></i>
        <span>ALERTAS</span>
      </a>
      
      <div class="nav-item-separator">SISTEMA</div>
      
      <a href="#" class="nav-link">
        <i class="fa-solid fa-circle-info"></i>
        <span>INFORMAÇÕES<br><small>GERAIS</small></span>
      </a>
      <a href="#" class="nav-link">
        <i class="fa-solid fa-headset"></i>
        <span>SUPORTE</span>
      </a>
    </nav>

    <div class="nav-footer">
      <div class="status-indicator">
        <div class="dot"></div>
        <span>Online</span>
      </div>
    </div>
  </aside>

  <main class="main-viewport">
    
    <header class="content-header">
      <div class="breadcrumb">
        <span>Sistema</span>
        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
        <strong>Histórico</strong>
      </div>

      <div class="user-profile">
        <span class="user-name">Admin</span>
        <div class="avatar"></div>
      </div>
    </header>

    <div class="scrollable-content">
      <h1 class="main-heading">Painel de <span class="highlight">Monitoramento</span></h1>
      <div class="charts-container">
        
        <section class="chart-section">
          <div class="section-header">
            <div class="chart-title-area">
              <div class="icon-circle temp"><i class="fa-solid fa-temperature-half"></i></div>
              <h2>Histórico de Temperatura (°C)</h2>
            </div>
            <div class="input-group">
              <input type="number" id="tempInput" placeholder="Nova temp">
              <button onclick="updateChart(tempChart, 'tempInput')">Atualizar</button>
            </div>
          </div>
          <div class="chart-card">
            <canvas id="tempChart"></canvas>
          </div>
        </section>

        <section class="chart-section">
          <div class="section-header">
            <div class="chart-title-area">
              <div class="icon-circle umid"><i class="fa-solid fa-droplet"></i></div>
              <h2>Histórico de Umidade (%)</h2>
            </div>
            <div class="input-group">
              <input type="number" id="umidInput" placeholder="Nova umid">
              <button onclick="updateChart(umidChart, 'umidInput')">Atualizar</button>
            </div>
          </div>
          <div class="chart-card">
            <canvas id="umidChart"></canvas>
          </div>
        </section>

      </div>
    </div>
  </main>
</div>

<script src="/script/historico.js"></script>
</body>
</html>
