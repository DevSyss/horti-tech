<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HortiTech - Cadastro de Câmaras</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/FrontEnd/css/cadastroCamara.css">
</head>
<body>

    <div class="glass-background"></div>

    <main class="main-container animate-pop-in">
        <section class="left-side">
            <div class="content-wrapper">
                <div class="logo-area">
                    <i class="fa-solid fa-leaf"></i>
                    <span>HortiTech</span>
                </div>
                <h1>CADASTRO <br> <span class="highlight">DE CÂMARAS</span></h1>
                <p>Cadastre suas câmaras frias com os requisitos necessários para o monitoramento.</p>
                <button class="btn-outline" onclick="window.history.back()">VOLTAR</button>
            </div>
        </section>

        <section class="right-side">
            <div class="card-cadastro">
                <div class="user-avatar">
                    <div class="avatar-circle">
                        <i class="fa-solid fa-snowflake"></i>
                    </div>
                </div>

                <form class="form-container" onsubmit="event.preventDefault(); alert('Câmara cadastrada com sucesso!');">
                    <div class="input-group">
                        <i class="fa-solid fa-tag"></i>
                        <input type="text" placeholder="NOME OU ID DA CÂMARA" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-temperature-high"></i>
                        <input type="text" placeholder="TEMPERATURA MÁXIMA" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-temperature-low"></i>
                        <input type="text" placeholder="TEMPERATURA MÍNIMA" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-toggle-on"></i>
                        <input type="text" placeholder="STATUS" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-microchip"></i>
                        <input type="text" placeholder="TIPO DE SENSOR" required>
                    </div>


                    <button type="submit" class="btn-main">CADASTRAR</button>
                </form>

                <div class="social-divider">
                    <span>OU SUPORTE</span>
                </div>

                <div class="social-wrapper">
                    <a href="#" class="social-item" title="Ajuda"><i class="fa-solid fa-circle-question"></i></a>
                    <a href="#" class="social-item" title="Documentação"><i class="fa-solid fa-book"></i></a>
                    <a href="#" class="social-item" title="Notificações"><i class="fa-solid fa-bell"></i></a>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
