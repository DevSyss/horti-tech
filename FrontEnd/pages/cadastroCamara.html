<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HortiTech - Cadastro Câmara</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="/css/cadastroCamara.css">

</head>

<body>

<div class="glass-background"></div>

<main class="main-container">

<section class="left-side">

<div class="logo-area">

<i class="fa-solid fa-leaf"></i>
<span>HortiTech</span>

</div>

<h1>

CADASTRO<br>

<span class="highlight">

DE CÂMARAS

</span>

</h1>

<p>
Cadastre e monitore câmaras frias do sistema.
</p>

</section>


<section class="right-side">

<div class="card-cadastro">

<div class="avatar-circle">

<i class="fa-solid fa-snowflake"></i>

</div>

<form id="cameraForm">

<div class="input-group">

<i class="fa-solid fa-tag"></i>

<input
id="nome"
type="text"
placeholder="NOME DA CÂMARA"
required>

</div>


<div class="input-group">

<i class="fa-solid fa-location-dot"></i>

<input
id="local"
type="text"
placeholder="LOCAL"
required>

</div>


<div class="input-group">

<i class="fa-solid fa-temperature-low"></i>

<input
id="temperaturaMinima"
type="number"
step="0.1"
placeholder="TEMPERATURA MÍNIMA"
required>

</div>


<div class="input-group">

<i class="fa-solid fa-temperature-high"></i>

<input
id="temperaturaMaxima"
type="number"
step="0.1"
placeholder="TEMPERATURA MÁXIMA"
required>

</div>


<div class="input-group">

<i class="fa-solid fa-microchip"></i>

<input
id="sensor"
type="text"
placeholder="TIPO SENSOR"
required>

</div>


<button
type="submit"
id="btnCadastrar"
class="btn-main">

CADASTRAR

</button>

</form>

</div>

</section>

</main>

<script src="/script/cadastroCamara.js"></script>

</body>

</html>
