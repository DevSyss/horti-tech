<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HortiTech • Central de Alertas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/alerta.css">
</head>

<body>

<div class="app-wrapper">

  <aside class="side-navigation">
    <div class="nav-brand">
      <div class="logo-circle">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <span>HortiTech</span>
    </div>

    <nav class="nav-menu">
      <a href="/index.html" class="nav-link">
        <i class="fa-solid fa-gauge-high"></i>
        <span>MONITORAMENTO</span>
      </a>
      <a href="/pages/historico.html" class="nav-link">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>HISTÓRICO</span>
      </a>
      
      <a href="/pages/alerta.html" class="nav-link active">
        <i class="fa-solid fa-bell"></i>
        <span>ALERTAS</span>
      </a>
      
      <div class="nav-item-separator">SISTEMA</div>
      
      <a href="/pages/informacoes.html" class="nav-link">
        <i class="fa-solid fa-circle-info"></i>
        <span>INFORMAÇÕES<br><small>GERAIS</small></span>
      </a>
      <a href="/pages/suporte.html" class="nav-link">
        <i class="fa-solid fa-headset"></i>
        <span>SUPORTE</span>
      </a>
    </nav>

    <div class="nav-footer">
      <div class="status-indicator">
        <div class="dot"></div>
        <span>Online</span>
      </div>
    </div>
  </aside>

  <main class="main-viewport">
    
    <header class="content-header">
      <div class="breadcrumb">
        <span>Sistema</span>
        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
        <strong>Suporte</strong>
      </div>

      <div class="user-profile">
        <span class="user-name">Admin</span>
        <div class="avatar"></div>
      </div>
    </header>

    <div class="scrollable-content">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;">
        <div>
          <h1 class="main-heading" style="margin-bottom: 4px;">Central de <span class="highlight">Alertas</span></h1>
          <h2 class="sub-heading" style="margin-bottom: 0;">Gerencie ocorrências em tempo real</h2>
        </div>

        <div class="topbar-actions">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar câmara...">
          </div>
          <button class="filter-btn">
            <i class="fa-solid fa-sliders"></i>
          </button>
        </div>
      </div>

      <section class="alerts-section">
        <div class="section-title">
          <span>Hoje • 13 Maio</span>
        </div>

        <article class="alert-card warning">
          <div class="alert-main-content">
            <div class="icon-box">
              <i class="fa-solid fa-temperature-high"></i>
            </div>
            <div class="alert-info">
              <h3>Aumento de Temperatura</h3>
              <div class="meta">
                <span><i class="fa-solid fa-warehouse"></i> Câmara 01</span>
                <span><i class="fa-solid fa-microchip"></i> ESP32</span>
                <span><i class="fa-solid fa-clock"></i> 14:30h</span>
              </div>
            </div>
          </div>
          <div class="alert-side">
            <strong>38.5°C</strong>
            <button class="btn-details">Detalhes</button>
          </div>
        </article>

        <article class="alert-card critical">
          <div class="alert-main-content">
            <div class="icon-box">
              <i class="fa-solid fa-plug-circle-xmark"></i>
            </div>
            <div class="alert-info">
              <h3>Falha de Conexão</h3>
              <div class="meta">
                <span><i class="fa-solid fa-wifi"></i> Gateway Offline</span>
                <span><i class="fa-solid fa-location-dot"></i> Setor Norte</span>
                <span><i class="fa-solid fa-clock"></i> 12:15h</span>
              </div>
            </div>
          </div>
          <div class="alert-side">
            <div class="status-pill danger">OFFLINE</div>
            <button class="btn-details">Detalhes</button>
          </div>
        </article>

      </section>
    </div>
  </main>
</div>

</body>
</html>
