<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HortiTech - Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

    <!-- Fundo -->
    <div class="glass-background"></div>

    <!-- Container -->
    <main class="main-container animate-pop-in">

        <!-- ESQUERDA -->
        <section class="left-side">

            <div class="content-wrapper">

                <div class="logo-area">

                    <i class="fa-solid fa-leaf"></i>

                    <span>HortiTech</span>

                </div>

                <h1>

                    BEM-VINDO <br>

                    <span class="highlight">
                        DE VOLTA!
                    </span>

                </h1>

                <p>
                    NÃO POSSUI UMA CONTA?
                </p>

                <a href="cadastro.html">

                    <button type="button" class="btn-outline">
                        CADASTRE-SE
                    </button>

                </a>

            </div>

        </section>

        <!-- DIREITA -->
        <section class="right-side">

            <div class="card-cadastro">

                <!-- Avatar -->
                <div class="user-avatar">

                    <div class="avatar-circle">

                        <i class="fa-solid fa-circle-user"></i>

                    </div>

                </div>

                <!-- FORM -->
                <form class="form-container" id="loginForm">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" placeholder="E-MAIL" required>

                    </div>

                    <!-- SENHA -->
                    <div class="input-group">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="senha" placeholder="SENHA" required>

                    </div>

                    <!-- PERFIL 
                    <div class="profile-selector-container">

                        <p class="selector-title">
                            SELECIONE SEU CARGO:
                        </p>

                        <div class="radio-inputs">

                            CHEFE 
                            <label class="radio">

                                <input type="radio" name="perfil" value="CHEFE" checked>

                                <span class="name">

                                    <i class="fa-solid fa-user-tie"></i>

                                    Chefe

                                </span>

                            </label>

                             FUNCIONARIO 
                            <label class="radio">

                                <input type="radio" name="perfil" value="FUNCIONARIO">

                                <span class="name">

                                    <i class="fa-solid fa-briefcase"></i>

                                    Funcionário

                                </span>

                            </label>

                        </div>

                    </div> -->

                    <!-- BOTÃO -->
                    <button type="submit" class="btn-main" id="btnEntrar">
                        ENTRAR
                    </button>

                </form>

                <!-- SOCIAL -->
                <div class="social-divider">

                    <span>OU ENTRE COM</span>
 <p id="mensagem-erro"></p>

                </div>

                <div class="social-wrapper">

                    <a href="#" class="social-item">

                        <i class="fa-brands fa-google"></i>

                    </a>

                    <a href="#" class="social-item">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                    <a href="#" class="social-item">

                        <i class="fa-brands fa-apple"></i>

                      

                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="/script/login.js"></script>

</body>

</html>
